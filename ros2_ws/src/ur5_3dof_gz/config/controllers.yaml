controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

# Receives Float64MultiArray from torque_bridge_node → applies effort to joints 1-3
arm_effort_controller:
  ros__parameters:
    type: effort_controllers/JointGroupEffortController
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint

# Receives Float64MultiArray from torque_bridge_node → holds wrists at zero
wrist_position_controller:
  ros__parameters:
    type: position_controllers/JointGroupPositionController
    joints:
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
